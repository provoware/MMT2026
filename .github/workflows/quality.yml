name: Module und Startprüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bestehende Tests ausführen
        run: npm test
